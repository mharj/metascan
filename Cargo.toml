[package]
name = "metascan"
version = "0.0.3"
edition = "2021"
description = "High-performance parallel posix filesystem metadata scanner"
license = "MIT"
repository = "https://github.com/mharj/metascan"
homepage = "https://github.com/mharj/metascan"
authors = ["Marko Harjula <mharj@github.com>"]
keywords = ["filesystem", "posix", "scanner", "metadata", "parallel"]
categories = ["command-line-utilities", "filesystem", "security"]
readme = "README.md"

[[bin]]
name = "metascan"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
crossbeam-deque = "0.8"

[target.'cfg(all(target_os = "linux", target_env = "musl"))'.dependencies]
mimalloc = "0.1"
