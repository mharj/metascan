[package]
name = "metascan"
version = "0.0.1"
edition = "2021"
description = "High-performance parallel posix filesystem metadata scanner"
license = "MIT"
repository = "https://github.com/mharj/greedy_rs"
homepage = "https://github.com/mharj/greedy_rs"
authors = ["Marko Harjula <mharj@github.com>"]
keywords = ["filesystem", "posix", "scanner", "metadata", "parallel"]
categories = ["command-line-utilities", "filesystem", "data-processing"]
readme = "README.md"

[[bin]]
name = "metascan"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
