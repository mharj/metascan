name: Publish to crates.io
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  
jobs:
  build-release-assets:
    name: Build release asset (${{ matrix.flavor }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            flavor: static
            asset_suffix: static
            needs_musl_tools: true
            cc_env: musl-gcc
          - target: x86_64-unknown-linux-gnu
            flavor: gnu
            asset_suffix: gnu
            needs_musl_tools: false
            cc_env: cc
    permissions:
      contents: write
    env:
      BIN_NAME: metascan
      CC_x86_64_unknown_linux_musl: ${{ matrix.cc_env }}
    steps:
    - uses: actions/checkout@v6
    - name: Install musl tools
      if: matrix.needs_musl_tools
      run: sudo apt-get update && sudo apt-get install -y musl-tools
    - name: Setup Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.target }}
    - name: Build
      run: cargo build --release --target "${{ matrix.target }}" --verbose
    - name: Prepare release asset name
      run: |
        TARGET="${{ matrix.target }}"
        ARCH="${TARGET%%-*}"
        mkdir -p dist
        cp "target/$TARGET/release/$BIN_NAME" "dist/$BIN_NAME.$ARCH"_${{ matrix.asset_suffix }}
    - name: Upload release asset artifact
      uses: actions/upload-artifact@v7
      with:
        name: release-assets-${{ matrix.flavor }}
        path: dist/*

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: build-release-assets
    environment: release  # Optional: for enhanced security
    permissions:
      id-token: write     # Required for OIDC token exchange
      contents: write
      pull-requests: write
    steps:
    - uses: actions/checkout@v6
    - name: Setup Rust toolchain
      uses: dtolnay/rust-toolchain@stable
    - name: Download all release asset artifacts
      uses: actions/download-artifact@v8
      with:
        pattern: release-assets-*
        path: dist
        merge-multiple: true
    - uses: softprops/action-gh-release@v3
      with:
        files: dist/*
    - uses: rust-lang/crates-io-auth-action@v1
      id: auth
    - run: cargo publish
      env:
        CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}